databases:
  - name: machinery-erp-db
    databaseName: machinery_erp
    user: machinery_user
    plan: free

services:
  - type: web
    name: machinery-erp-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data
    startCommand: cd backend && gunicorn machinery_erp.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: USE_POSTGRES
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: machinery-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
